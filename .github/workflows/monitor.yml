name: monitor
# The outside witness. The Worker's cron is the system's only clock (press windows, term sweep,
# chain watcher, nightly exception digest all run in its slots), but a dead Worker cannot report
# its own death — so something outside Cloudflare looks in once a week and fails loudly when the
# live system stops behaving. This file deploys nothing and writes nothing to production except
# the sandbox store's own probe orders, which prod_check creates and cancels itself.
on:
  schedule:
    - cron: '20 5 * * 1'   # Mondays 05:20 UTC — before the week's traffic, never gated by hour
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  prod-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prod_check against the sandbox store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: https://tapstall.zlnew.workers.dev
          HANDLE: logintest        # the internal test store, never a real operator's shop
        run: |
          set +e   # GitHub's bash -e would kill the step on rc=1 before anything prints —
                   # the run that taught us this produced 4 minutes of silence and no log
          bash scripts/prod_check.sh > /tmp/prod.out 2>/tmp/prod.err; rc=$?
          sed 's/\x1b\[[0-9;]*m//g' /tmp/prod.out > /tmp/prod.clean
          cat /tmp/prod.clean
          tail -c 600 /tmp/prod.err
          {
            echo "## prod_check (weekly outside witness)"
            grep -E "^(target:|store:)" /tmp/prod.clean
            grep -cE "^  \+ " /tmp/prod.clean | sed 's/^/passed checks: /'
            echo "failed checks:"
            grep -E "^  - " /tmp/prod.clean || echo none
            grep -cE "^  ! " /tmp/prod.clean | sed 's/^/blocked lines: /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
