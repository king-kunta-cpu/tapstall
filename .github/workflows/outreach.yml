name: outreach
# Email outreach, run where SMTP/IMAP is boring and free: GitHub Actions. The Worker's cron is
# the only clock — its weekday dispatch slot fires this (dispatchTick), exactly like leads-hunt;
# there is deliberately no schedule here. Sellers send from their OWN Gmail via app password:
# credentials are Worker secrets (GMAIL_<TAG>_USER / GMAIL_<TAG>_APP_PASSWORD) that the runner
# fetches at runtime behind the admin gate — they are never in this repo or in KV.
# The Worker stays the judge: this script only sends to leads the Worker calls eligible
# (2+ signals, under the touch cap, follow-up due) and files every outcome back through
# POST /api/leads/act, including STOP -> the do-not-contact ledger.
on:
  # Autonomous, on the same ladder as hunting but an hour later. Unattended runs
  # cannot type into the description box, so the defaults below are the real
  # policy: send-and-poll, twenty sends per mailbox. Twenty is the owner's
  # setting as of 21 October 2026 and sits inside the warm-up ladder (10 -> 20 ->
  # 25 -> 40 -> 50 a day on a weekly step), so the ramp is still the point: a
  # mailbox that opens at a hundred gets its domain burned, and a burned domain
  # costs more than the week it saved. Raise it a rung at a time, and only while
  # bounce and complaint rates stay flat. The Worker remains the judge: this only
  # sends to leads it calls eligible (two signals, under the touch cap, follow-up
  # due), and every STOP still lands in the do-not-contact ledger.
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'send_and_poll | dry_run | poll_only | send_only'
        required: false
        default: 'dry_run'
      per_mailbox_cap:
        description: 'Max sends per mailbox this run (warm-up ramp: 20 -> 100 over a week)'
        required: false
        default: '20'
  repository_dispatch:
    types: [outreach]

permissions:
  contents: read

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: outreach
        env:
          TAPSTALL_ORIGIN: https://tapstall.zlnew.workers.dev
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OWNER_NOTIFY_EMAIL: ${{ secrets.OWNER_NOTIFY_EMAIL }}
          OUTREACH_FROM_NAME: ${{ secrets.OUTREACH_FROM_NAME }}
        run: |
          # scheduled runs carry no inputs: send_and_poll at the warm-up cap
          MODE="${{ github.event.inputs.mode || 'send_and_poll' }}"
          CAP="${{ github.event.inputs.per_mailbox_cap || '20' }}"
          case "$MODE" in
            send_and_poll) python3 scripts/mail_outreach.py --send --per-mailbox-cap "$CAP" ;;
            send_only)     python3 scripts/mail_outreach.py --send --send-only --per-mailbox-cap "$CAP" ;;
            poll_only)     python3 scripts/mail_outreach.py --send --poll-only ;;
            *)             python3 scripts/mail_outreach.py --dry-run --per-mailbox-cap "$CAP" ;;
          esac
      - name: summary
        if: always()
        run: echo "Outreach finished. Counts are in the step log (no addresses or message bodies are ever logged)." >> "$GITHUB_STEP_SUMMARY"
