name: deploy
# Push to main => tests, deploy the Worker, publish the public pages.
# Zero human steps: no dashboard, no wrangler login, no per-customer work.
on:
  push:
    branches: [main]
    paths-ignore: ['ci-deploy.log', '**.md', 'docs/**']
  # No schedule here (v1.0.0). The Worker's own cron is the only clock in the system: it runs
  # the press windows, the term sweep, the chain watcher and the nightly exception digest in
  # slots. A GitHub schedule on this workflow used to redeploy identical code daily (two fresh
  # versions per Worker, a secret re-set, two log commits) while its prod-check job skipped
  # itself on an hour gate GitHub's delivery times never met — green runs, nothing checked.
  # Looking in from outside still matters, so monitor.yml pings weekly (read-only) and runs
  # the full prod_check monthly against the sandbox store; dispatching work INTO Actions
  # (leads-hunt) is the Worker's scheduler job.
  workflow_dispatch: {}

permissions:
  contents: write      # failure-only deploy log + Pages
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No heartbeat commit (v1.3.0): it cost a bot commit on every deploy and
      # the run is diagnosable from Actions logs with a repo token. The deploy
      # log below is still committed — but only when the deploy fails.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci          # devDependency: wrangler (owns the upload format + schedule)
      - run: node --test tests/
      - run: python3 scripts/mail_outreach.py --selftest   # v2.0.0: quotes, one voice, unsubscribe, bounces

      - name: deploy worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          WHOP_CHECKOUT_URL: ${{ secrets.WHOP_CHECKOUT_URL }}
          WHOP_CHECKOUT_URL_ANNUAL: ${{ secrets.WHOP_CHECKOUT_URL_ANNUAL }}
          WHOP_CHECKOUT_URL_MONTHLY: ${{ secrets.WHOP_CHECKOUT_URL_MONTHLY }}
          WHOP_PLANS_JSON: ${{ secrets.WHOP_PLANS_JSON }}
          PLATFORM_PAY_DETAILS: ${{ secrets.PLATFORM_PAY_DETAILS }}
          WORKER_NAME: tapstall
        run: |
          set +e
          bash ./scripts/deploy.sh 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          {
            echo "==== exit=$code $(date -u +%FT%TZ) ===="
            echo "==== tools ===="
            for c in node npm jq curl openssl python3; do
              printf '%s=%s ' "$c" "$(command -v "$c" || echo MISSING)"
            done
            echo
            echo "==== inputs visible to this step ===="
            for v in CF_TOKEN CF_ACCOUNT ADMIN_SECRET WORKER_NAME; do
              eval "x=\${$v:-}"
              printf '%s=%s ' "$v" "$([ -n "$x" ] && echo "set(len ${#x})" || echo MISSING)"
            done
            echo
          } >> /tmp/deploy.log
          tail -40 /tmp/deploy.log
          exit $code

      - name: publish the deploy log (failures only)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tapstall-ci" || true
          git config user.email "ci@tapstall.invalid" || true
          [ -s /tmp/deploy.log ] || exit 0
          sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" \
            | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p')
          body=$(python3 -c '
          import base64,json,os,sys
          raw=open("/tmp/deploy.log","rb").read()[:90000]
          out={"message":os.environ.get("LOG_MSG","ci deploy log"),"content":base64.b64encode(raw).decode()}
          if sys.argv[1]: out["sha"]=sys.argv[1]
          print(json.dumps(out))' "$sha")
          curl -s -o /dev/null -w 'log publish: http %{http_code}\n' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" -d "$body"

  # Pages is independent: a broken Cloudflare token must never take the public
  # landing page and the fee calculator off the air.
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The mirror's marketing pages are the shipped ones, copied in here so
      # pages/public can never carry a stale draft of a page the Worker serves.
      # (index/fees are not committed under public/ any more; onboard.html is,
      # because it exists only for this host.)
      - name: assemble the mirror
        run: |
          cp pages/index.html pages/fees.html pages/public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/public
      - id: out
        uses: actions/deploy-pages@v4
