name: deploy
# Push to main => tests, then deploy the Worker and publish the public pages.
# Zero human steps: no dashboard, no wrangler login, no manual store work.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci   # devDependency: wrangler (owns the deploy format + schedule)
      - name: tests
        run: node --test tests/
      - name: deploy worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_NAME: zimlink
        run: ./scripts/deploy.sh
  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.out.outputs.page_url }} }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages/public }
      - id: out
        uses: actions/deploy-pages@v4
