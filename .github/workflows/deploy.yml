name: deploy
# Push to main => tests, deploy the Worker, publish the public pages.
# Zero human steps: no dashboard, no wrangler login, no per-customer work.
on:
  push:
    branches: [main]
    paths-ignore: ['ci-deploy.log']
  schedule:
    # One slot, on the day's first hour. It used to be four: pages were KV keys, a spent write
    # budget could leave a page nine hours behind git, and the only cure was to try again after
    # midnight — so four tries a day was the mechanism, and GitHub's habit of dropping scheduled
    # runs (measured: one delivery in 83 runs) was the reason it was four and not one. Since
    # v0.9.1 a page is a bundle byte, published by the same upload as the code that reads it, so
    # there is nothing left to retry, and what the night has to do is *look*. One run a day of
    # prod_check is the whole job, and the Actions minutes for the month go from about 240 to 60.
    - cron: '20 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write      # deploy log + Pages
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The one failure at $0 hosting that looks like success: the Worker deploys, a page
  # does not, because the account's 1,000 free KV writes a day were spent before the
  # template step ran. deploy.sh says so and carries on — and then nothing retries it,
  # because a retry needs a push. This is the retry. Every slot is after the 00:00 UTC
  # reset; on a day with nothing missing it spends no write at all, reads every page
  # back against git, and goes green in seconds. Four slots because one is not a
  # mechanism (see the cron comment above).
  night-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The other half of an unattended night. A stale page is no longer a thing that can happen —
      # git's bytes are the bundle and the bundle is what serves — so the night's job is to *look*:
      # one production check a day, before the day's KV writes are spent by real traffic. `prod_check.sh` is the 300-line check against
      # the live Worker that only runs when a human types it, which is why 96 write-gated
      # assertions sat unexecuted for two days and reported health. Here it needs no PIN:
      # the login-door lines self-skip with a note, and everything else runs. `blocked` is
      # not `failed` — a day with no KV writes left exits 0 with the count, so the alarm
      # only rings on a real defect.
      - name: run the production check against the live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          hr=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$hr" != 00 ] && [ "$hr" != 01 ]; then
            echo "production check runs on the first slot of the UTC day (00:20; 01:20 if GitHub delivers it late) — skipping this one"
            exit 0
          fi
          set +e
          bash ./scripts/prod_check.sh > /tmp/prodcheck.log 2>&1
          code=$?
          set -e
          # ~600 lines of output, and the tail would hide the one line that matters. Colour is
          # stripped so the log reads the same here as in a terminal; failures print in full with
          # what they wanted and got; blocked lines are counted, not itemised. `|| true` because a
          # run with no failures makes grep exit 1, and that is not a red build.
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/prodcheck.log
          grep -c '^  + ' /tmp/prodcheck.log | sed 's/^/lines that ran against production and passed: /' || true
          grep -A2 '^  - ' /tmp/prodcheck.log | head -80 || true
          awk "/^  ! /{b++} END { if (b) print \"not verifiable in this run (rate limit, KV mirror lag, or a spent KV write budget): \" b \" lines\" }" /tmp/prodcheck.log || true
          tail -3 /tmp/prodcheck.log || true
          echo "prod_check exit=$code  $(grep -a 'passed:' /tmp/prodcheck.log | tail -1)" || true
          exit $code

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Announce the run through the contents API *before* anything that can
      # fail, because a job whose logs the token cannot read is undiagnosable.
      - name: heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'worker job started %s run=%s sha=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" "${GITHUB_SHA:0:7}" > ci-deploy.log
          sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" \
            | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p')
          body=$(python3 -c '
          import base64,json,os,sys
          raw=open("ci-deploy.log","rb").read()
          out={"message":"ci heartbeat","content":base64.b64encode(raw).decode()}
          if sys.argv[1]: out["sha"]=sys.argv[1]
          print(json.dumps(out))' "$sha")
          curl -s -o /tmp/hb.json -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" -d "$body"
          head -c 200 /tmp/hb.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci          # devDependency: wrangler (owns the upload format + schedule)
      - run: node --test tests/

      - name: deploy worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_NAME: tapstall
        run: |
          set +e
          bash ./scripts/deploy.sh 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          {
            echo "==== exit=$code $(date -u +%FT%TZ) ===="
            echo "==== tools ===="
            for c in node npm jq curl openssl python3; do
              printf '%s=%s ' "$c" "$(command -v "$c" || echo MISSING)"
            done
            echo
            echo "==== inputs visible to this step ===="
            for v in CF_TOKEN CF_ACCOUNT ADMIN_SECRET WORKER_NAME; do
              eval "x=\${$v:-}"
              printf '%s=%s ' "$v" "$([ -n "$x" ] && echo "set(len ${#x})" || echo MISSING)"
            done
            echo
          } >> /tmp/deploy.log
          tail -40 /tmp/deploy.log
          exit $code

      - name: publish the deploy log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tapstall-ci" || true
          git config user.email "ci@tapstall.invalid" || true
          [ -s /tmp/deploy.log ] || exit 0
          sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" \
            | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p')
          body=$(python3 -c '
          import base64,json,os,sys
          raw=open("/tmp/deploy.log","rb").read()[:90000]
          out={"message":os.environ.get("LOG_MSG","ci deploy log"),"content":base64.b64encode(raw).decode()}
          if sys.argv[1]: out["sha"]=sys.argv[1]
          print(json.dumps(out))' "$sha")
          curl -s -o /dev/null -w 'log publish: http %{http_code}\n' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" -d "$body"

  # Pages is independent: a broken Cloudflare token must never take the public
  # landing page and the fee calculator off the air.
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The mirror's marketing pages are the shipped ones, copied in here so
      # pages/public can never carry a stale draft of a page the Worker serves.
      # (index/fees are not committed under public/ any more; onboard.html is,
      # because it exists only for this host.)
      - name: assemble the mirror
        run: |
          cp pages/index.html pages/fees.html pages/public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/public
      - id: out
        uses: actions/deploy-pages@v4
