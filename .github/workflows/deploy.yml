name: deploy
# Push to main => tests, then deploy the Worker and publish the public pages.
# Zero human steps: no dashboard, no wrangler login, no manual store work.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci   # devDependency: wrangler (owns the deploy format + schedule)
      - name: tests
        run: node --test tests/
      - name: deploy worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_NAME: zimlink
        run: |
          set +e
          bash -x ./scripts/deploy.sh 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          echo "---- tools ----"; for c in node jq curl openssl python3; do printf '%s=%s ' "$c" "$(command -v $c || echo MISSING)"; done; echo
          echo "---- env ----"; for v in CF_TOKEN CF_ACCOUNT ADMIN_SECRET WORKER_NAME; do printf '%s:len=%s ' "$v" "${!#v:+set}"; done; echo
          mkdir -p "$RUNNER_TEMP/artifact" && cp /tmp/deploy.log "$RUNNER_TEMP/artifact/deploy.log"
          exit $code
      - name: upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: deploy-log, path: '${{ runner.temp }}/artifact/' , if-no-files-found: ignore }
  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.out.outputs.page_url }} }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages/public }
      - id: out
        uses: actions/deploy-pages@v4
