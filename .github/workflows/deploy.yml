name: deploy
# Push to main => tests, then deploy the Worker and publish the public pages.
# Zero human steps: no dashboard, no wrangler login, no manual store work.
on:
  push:
    branches: [main]
    paths-ignore: ['ci-deploy.log']
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # so a failed deploy can publish its own log for diagnosis
    steps:
      # First step, before any action can fail: reports through the API so a job
      # that dies in checkout still tells us it started.
      - name: heartbeat
        env: { GH_TOKEN: ${{ github.token } }
        run: |
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" \
            -d "$(printf '{"message":"ci heartbeat worker start","content":"%s","sha":"%s"}' \
              "$(printf 'worker job started %s run=%s sha=%s\n' "$(date -u +%T)" "$GITHUB_RUN_ID" "${GITHUB_SHA:0:7}" | base64 -w0)" \
              "$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-deploy.log" | sed -n 's/.*"sha": "\([a-f0-9]*\)".*/\1/p')")" > /tmp/hb.json
          cat /tmp/hb.json | head -c 300
      - name: heartbeat2 (after a no-op)
        if: always()
        run: echo "this step runs only if the previous one exists" 
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci   # devDependency: wrangler (owns the deploy format + schedule)
      - name: tests
        run: node --test tests/
      - name: deploy worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_NAME: zimlink
        run: |
          set +e
          bash -x ./scripts/deploy.sh 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          echo "---- tools ----" >> /tmp/deploy.log
          for c in node jq curl openssl python3 npm; do printf '%s=%s ' "$c" "$(command -v $c || echo MISSING)" >> /tmp/deploy.log; done >> /tmp/deploy.log
          echo >> /tmp/deploy.log
          echo "---- present vars ----" >> /tmp/deploy.log
          for v in CF_TOKEN CF_ACCOUNT ADMIN_SECRET WORKER_NAME GITHUB_REF; do
            eval "val=\${$v:-}"; echo "$v=$([ -n "$val" ] && echo set || echo MISSING)" >> /tmp/deploy.log
          done
          # publish the log into the repo: job logs need actions:read on the token,
          # and a deploy that can fail silently is not zero-touch
          git config user.name ci >> /tmp/deploy.log 2>&1
          git config user.email ci@zimlink >> /tmp/deploy.log 2>&1
          cp /tmp/deploy.log ci-deploy.log
          git add -f ci-deploy.log >> /tmp/deploy.log 2>&1
          git commit -m "ci deploy log ($(date -u +%H:%M:%S)) exit=$code" >> /tmp/deploy.log 2>&1
          git push >> /tmp/deploy.log 2>&1 || true
          exit $code
  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.out.outputs.page_url }} }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages/public }
      - id: out
        uses: actions/deploy-pages@v4
      - name: heartbeat (pages ok)
        if: always()
        run: |
          echo "pages job finished conclusion=${{ job.status }} $(date -u +%T)" > ci-deploy.log
          git config user.name ci; git config user.email ci@zimlink
          git add -f ci-deploy.log && git commit -m "ci heartbeat: pages" && git push || true
