name: diag
# Throwaway: a job whose only job is to report back through a committed file.
# Used because this token cannot read Actions job logs.
on:
  workflow_dispatch: {}
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          {
            echo "run: $GITHUB_RUN_ID  ref: $GITHUB_REF  actor: $ACTOR"
            echo "--- tools ---"
            for c in node npm jq curl openssl python3 git; do
              printf '%s=%s ' "$c" "$(command -v "$c" || echo MISSING)"
            done; echo
            node -v; npm -v
            echo "--- secrets visible to the job ---"
            for v in CF_TOKEN CF_ACCOUNT ADMIN_SECRET; do
              eval "x=\\${$v:-}"; printf '%s=%s ' "$v" "$([ -n "$x" ] && echo "set(len ${#x})" || echo MISSING)"
            done; echo
            echo "--- outbound CF API from the runner ---"
            curl -s -o /tmp/probe.json -w 'GET /accounts http %{http_code}\n' \
              -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT" || echo "curl failed"
            jq -c '{success, name: .result.name}' /tmp/probe.json 2>/dev/null || head -c 200 /tmp/probe.json
            echo "--- scripts referenced ---"
            ls scripts; ls -a | tr '\n' ' '; echo
          } > diag.log 2>&1
          git config user.name "ci-probe"
          git config user.email "ci@zimlink"
          git add -f diag.log
          git commit -m "diag log" --allow-empty
          git push origin HEAD:${{ github.ref_name }} || git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}
