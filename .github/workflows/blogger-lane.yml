name: blogger-lane
# The Blogger lane, and the estate's shared email pool.
#
# Posts the next unpublished article to this venture's Blogger blog through
# Mail2Blogger, from the one shared pool account. Runs on a schedule, so posting
# happens without anybody remembering to do it.
#
# Off, not broken: if BLOGGER_POST_EMAIL is unset the run finishes green and says
# the lane is off. Add the blog's secret posting address as a repo secret to turn
# it on.
on:
  schedule:
    - cron: "23 7 * * 1,4"   # Mondays and Thursdays, 07:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Say what would go out, send nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  blogger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pool check
        env:
          EMAIL_POOL_ADDRESS: ${{ secrets.EMAIL_POOL_ADDRESS }}
          EMAIL_POOL_APP_PASSWORD: ${{ secrets.EMAIL_POOL_APP_PASSWORD }}
        run: python3 press/blogger.py --check || true
      - name: Post the next article
        env:
          EMAIL_POOL_ADDRESS: ${{ secrets.EMAIL_POOL_ADDRESS }}
          EMAIL_POOL_APP_PASSWORD: ${{ secrets.EMAIL_POOL_APP_PASSWORD }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          BLOGGER_BLOG_URL: ${{ secrets.BLOGGER_BLOG_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 press/blogger.py --dry-run
          else
            python3 press/blogger.py --once
          fi
      - name: Remember what shipped
        run: |
          if [ -n "$(git status --porcelain press/state 2>/dev/null)" ]; then
            git config user.name "blogger-lane"
            git config user.email "simalidudu@gmail.com"
            git add press/state
            git commit -m "blogger: record the post that went out [skip ci]"
            git push || true
          fi
