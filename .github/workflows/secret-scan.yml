name: secret scan

# Every push and every pull request, plus a weekly pass over the whole history.
# A committed key is not a bug you fix later — it is a key somebody already has. This fails the
# build the moment one appears, on the branch, before it can merge.
#
# Uses the gitleaks binary rather than the action: the action needs a paid licence on organisation
# repositories, and a scanner that cannot run is worse than no scanner.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks version
      - name: Scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
