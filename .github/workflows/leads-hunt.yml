name: leads-hunt
# Build step 3 (2026-11-06): the global harvest. Sellers in the 105 countries Stripe does not serve, from the
# public Chrome UX Report country lists; one slice of the pool per run (the run number picks it), one homepage
# GET per host plus one contact page for a page that already shows the evidence. A lead needs all three facts:
# it sells online, a trigger (WhatsApp order link, local wallet, bank transfer, proof of payment), and a generic
# inbox on its own domain. It never emails anyone: it files into the Worker (POST /api/leads/ingest), which
# re-judges every lead and keeps them in TS_DB. The Worker's 06:15 UTC sweep dispatches this Mon/Wed/Fri.
# The OSM / classifieds hunter (scripts/lead_hunt.py) is retired from the schedule.
on:
  workflow_dispatch:
    inputs:
      post:
        description: 'POST results into the Worker (true) or dry-run print only'
        required: false
        default: 'true'
      limit:
        description: 'Hosts to probe this run'
        required: false
        default: '1700'
      mode:
        description: 'harvest, or recheck (re-read the queued leads against the evidence rule)'
        required: false
        default: 'harvest'
  repository_dispatch:
    types: [leads-hunt]

permissions:
  contents: read

concurrency:
  group: leads-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # ~6 min a run, Mon/Wed/Fri
    steps:
      - uses: actions/checkout@v4
      - name: selftest
        run: python3 scripts/harvest_global.py --selftest
      - name: CrUX lists (cached; refreshed when a new month appears)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crux
          key: crux-${{ github.run_id }}
          restore-keys: crux-
      - name: harvest
        env:
          TAPSTALL_ORIGIN: https://tapstall.tapstall.workers.dev
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          POST_FLAG="--dry-run"
          [ "${{ github.event.inputs.post || 'true' }}" = "true" ] && POST_FLAG="--post"
          if [ "${{ github.event.inputs.mode || 'harvest' }}" = "recheck" ]; then
            python3 scripts/harvest_global.py --recheck $POST_FLAG | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # keep only this month's lists in the cache
            find "$RUNNER_TEMP/crux" -name '*.csv.gz' -mtime +40 -delete 2>/dev/null || true
            python3 scripts/harvest_global.py $POST_FLAG --limit "${{ github.event.inputs.limit || '1700' }}" --cache "$RUNNER_TEMP/crux" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
