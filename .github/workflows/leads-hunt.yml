name: leads-hunt
# The hunter, run where fetching the open web is cheap and time is free: GitHub Actions.
# The Worker (single clock) dispatches this on weekday mornings (GH_DISPATCH_TOKEN on the Worker); a person can also run it by hand. It never emails anyone — it only files
# prospects into the Worker, which scores them by evidence (two signals before outreach),
# allocates each to exactly one seller, and drops anything on the do-not-contact ledger.
on:
  # v2.0.0: no schedule. The Worker's 06:15 UTC sweep dispatches this on weekdays and, since
  # v2.0.0, retries a failed dispatch at the next sweep; a schedule here as well ran it twice a day.
  workflow_dispatch:
    inputs:
      post:
        description: 'POST results into the Worker (true) or dry-run print only'
        required: false
        default: 'true'
      limit:
        description: 'Max leads to file'
        required: false
        default: '60'
      countries:
        description: 'Country codes, comma-separated'
        required: false
        default: 'ZA,ZW'
  repository_dispatch:
    types: [leads-hunt]

permissions:
  contents: read

concurrency:
  group: leads-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hunt
        env:
          TAPSTALL_ORIGIN: https://tapstall.zlnew.workers.dev
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          # A Worker dispatch carries no inputs, so the defaults below are what actually
          # runs unattended: file the batch, 40 at a time, South Africa and Zimbabwe.
          POST_FLAG="--dry-run"
          [ "${{ github.event.inputs.post || 'true' }}" = "true" ] && POST_FLAG="--post"
          python3 scripts/lead_hunt.py $POST_FLAG \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            --countries "${{ github.event.inputs.countries || 'ZA,ZW' }}"
      - name: summary
        if: always()
        run: echo "Lead hunt finished. Results land in the Worker (POST /api/leads/ingest); see the hunt step log for counts." >> "$GITHUB_STEP_SUMMARY"
