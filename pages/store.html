<html lang="en">
<head>

<!--@SEO@-->
<title>Tapstall Store</title>
<meta name="theme-color" content="#0b0f14">
<style>
*{box-sizing:border-box}
:root{--accent:#0a6b33;--accent-dark:#0b0f14;--accent-soft:#e8f7ef;--on-accent:#fff;--radius:16px}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#101418;-webkit-text-size-adjust:100%}
.wrap{max-width:34rem;margin:0 auto;padding:0 0 6.5rem}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--accent-dark),#101820);color:#fff;padding:.9rem 1rem .8rem;box-shadow:0 1px 0 rgba(16,24,32,.08)}
.hero{min-height:9.5rem;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,var(--accent-dark),var(--accent));background-size:cover;background-position:center}
.hero-in{padding:1rem;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.kicker{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.88}
.hero-title{font-size:1.55rem;font-weight:800;line-height:1.08;margin-top:.25rem}
.hero-in p{margin:.35rem 0 0;font-size:.9rem;max-width:26rem;color:#f3f7fb}
body.hero-minimal header{background:#fff;color:#101418;border-bottom:1px solid #e6ebf0;box-shadow:none}
body.hero-minimal .tag{color:#65788b}
body.hero-minimal .chip{background:var(--accent-soft);color:#24313d}
body.hero-minimal a.chip{border-color:#d7e2ea;color:#24313d}
.brand{display:flex;gap:.7rem;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#22303c;flex:0 0 auto}
h1{font-size:1.05rem;margin:0;line-height:1.2}
.tag{margin:.15rem 0 0;font-size:.8rem;color:#aebbc7}
.meta{font-size:.75rem;color:#8fa0af;margin-top:.45rem;display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:#1a2530;border-radius:999px;padding:.15rem .5rem}
a.chip{color:#dbe6f0;text-decoration:none;border:1px solid #2b3a48}
a.chip:active,a.chip:hover{background:#243342}
.welcome{margin:.75rem 1rem 0;background:#fff;border:1px solid #e6ebf0;border-left:4px solid var(--accent);border-radius:12px;padding:.65rem .75rem;font-size:.86rem;color:#33465a}
.tools{padding:.7rem 1rem 0}
.tools input{border-radius:999px;padding:.62rem .85rem;box-shadow:0 1px 8px rgba(16,24,32,.04)}
.about{margin:1rem;background:#fff;border:1px solid #e6ebf0;border-radius:var(--radius);padding:.85rem}
.about h2{font-size:.95rem;margin:0 0 .35rem}
.about p{margin:0;font-size:.86rem;color:#54677a;white-space:pre-line}
.waFloat{position:fixed;right:1rem;bottom:5.7rem;z-index:14;background:#128c4a;color:#fff;text-decoration:none;font-weight:700;font-size:.82rem;border-radius:999px;padding:.65rem .85rem;box-shadow:0 8px 24px rgba(16,24,32,.22)}
.pfbar{margin:.6rem 1rem 0;background:#eef4fb;border:1px solid #cfdfeb;color:#18324c;font-size:.82rem;padding:.5rem .65rem;border-radius:10px;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.pfbar a{color:#0b4a86;font-weight:600}
.pfbar .x{margin-left:auto;background:none;border:0;color:#65788b;font:inherit;padding:0 .15rem;cursor:pointer}
.pfbar[hidden]{display:none}
.notice{margin:.7rem 1rem 0;background:#fff7e6;border:1px solid #f0d9a8;color:#6b4d09;font-size:.8rem;padding:.55rem .7rem;border-radius:10px}
.cats{display:flex;gap:.4rem;overflow-x:auto;padding:.75rem 1rem .3rem;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;font-size:.82rem;padding:.38rem .72rem;border-radius:999px;background:#fff;border:1px solid #dde3e9}
.cat.on{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;padding:.5rem 1rem}
.card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid #e6ebf0;display:flex;flex-direction:column;box-shadow:0 1px 10px rgba(16,24,32,.045)}
.card img{width:100%;height:6.4rem;object-fit:cover;background:#eef2f6;display:block}
.card .noimg{height:6.4rem;background:linear-gradient(135deg,var(--accent-soft),#eef2f6)}
.cb{padding:.55rem .6rem .65rem;display:flex;flex-direction:column;gap:.18rem;flex:1}
.ck{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-dark);opacity:.78}
.pop{display:inline-flex;align-self:flex-start;background:var(--accent-soft);color:var(--accent-dark);border:1px solid rgba(16,24,32,.08);border-radius:999px;padding:.08rem .42rem;font-size:.64rem;font-weight:800}
.cn{font-size:.88rem;font-weight:700;line-height:1.25}
.cd{font-size:.73rem;color:#65788b;line-height:1.32;max-height:2.65em;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;gap:.4rem}
.price{font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums;color:var(--accent-dark)}
.alt{font-size:.68rem;color:#7b8b9b;font-weight:500}
.add{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;font-size:.78rem;padding:.42rem .62rem;font-weight:700;min-height:2rem}
body.layout-compact .grid{gap:.45rem}
body.layout-compact .card img,body.layout-compact .card .noimg{height:4.4rem}
body.layout-compact .cb{padding:.42rem .48rem .5rem}
body.layout-compact .cn{font-size:.8rem}
body.layout-compact .cd{font-size:.68rem;max-height:2em}
body.layout-list .grid{grid-template-columns:1fr}
body.layout-list .card{flex-direction:row;min-height:6.8rem}
body.layout-list .card img,body.layout-list .card .noimg{width:6.8rem;height:auto;min-height:6.8rem;flex:0 0 6.8rem}
body.layout-list .cb{padding:.65rem .7rem}
.add[disabled]{background:#c3ccd5;color:#fff}
.soldout{font-size:.7rem;color:#b00020;font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(16,24,32,.18);z-index:20;max-height:88vh;overflow:auto;transform:translateY(102%);transition:transform .22s ease}
.sheet.on{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem .3rem}
.sh-head b{font-size:.95rem}
.x{background:#eef2f6;border:0;border-radius:8px;padding:.3rem .55rem;font-size:.85rem;color:#333}
.body{padding:.4rem 1rem 1rem}
h4{margin:.8rem 0 .35rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#65788b}
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt{border:1px solid #dde3e9;background:#fff;border-radius:10px;padding:.4rem .6rem;font-size:.82rem}
.opt.on{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark)}
.qty{display:flex;align-items:center;gap:.7rem;margin-top:.7rem}
.qb{width:2.4rem;height:2.4rem;border-radius:10px;border:1px solid #dde3e9;background:#fff;font-size:1.1rem}
.cta{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:.85rem;font-size:.95rem;font-weight:700;margin-top:.8rem}
.cta.ghost{background:#fff;color:var(--accent-dark);border:1px solid #cfd8e0}
label{display:block;font-size:.78rem;color:#42566a;margin:.6rem 0 .2rem;font-weight:600}
input,textarea,select{width:100%;padding:.65rem .7rem;border:1px solid #dde3e9;border-radius:10px;font:inherit;font-size:.92rem;background:#fff}
textarea{min-height:3.5rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6ebf0;padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom));z-index:15;display:none;gap:.7rem;align-items:center}
.bar.on{display:flex}
.bar .t{font-weight:700;font-variant-numeric:tabular-nums}
.bar .n{font-size:.75rem;color:#65788b}
.bar button{flex:1;margin:0}
.empty{padding:2.5rem 1.4rem;text-align:center;color:#5b6c7d;font-size:.9rem}
.done{text-align:center;padding:1.4rem 1rem}
.done .tick{width:3rem;height:3rem;border-radius:50%;background:#0b3d2e;color:#8ff0c0;display:flex;align-items:center;justify-content:center;margin:0 auto .7rem;font-size:1.4rem}
.code{font-family:ui-monospace,Menlo,monospace;background:#f1f5f8;border-radius:8px;padding:.2rem .45rem;font-weight:700}
.paybox{background:#0b0f14;color:#e8eef4;border-radius:14px;padding:.85rem;text-align:left;margin:.9rem 0;font-size:.86rem}
.paybox .big{font-size:1.5rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.paybox .kv{display:flex;justify-content:space-between;gap:.6rem;padding:.28rem 0;border-top:1px solid #1e2a36;font-size:.8rem}
.paybox .kv span:last-child{font-weight:600;text-align:right}
.hint{font-size:.74rem;color:#93a5b6;margin-top:.5rem;line-height:1.4}
ol.steps{margin:.6rem 0 0;padding-left:1.1rem;font-size:.82rem}
ol.steps li{margin:.25rem 0}
.copy{background:#18222c;border:1px solid #2a3946;color:#cfe0ee;border-radius:9px;padding:.45rem .6rem;font-size:.8rem;width:100%;margin-top:.6rem}
.lines{text-align:left;font-size:.85rem;margin:.8rem 0}
.lines div{display:flex;justify-content:space-between;padding:.22rem 0;border-bottom:1px dashed #e6ebf0}
.lines div.tot{font-weight:700;border:0;padding-top:.45rem}
.foot{text-align:center;font-size:.72rem;color:#8194a5;padding:1.4rem 1rem 2.2rem}
.foot a{color:#4a6b8a}
.badge{display:inline-block;font-size:.7rem;background:#e8f7ef;color:#0b5b34;border:1px solid #bfe6d0;border-radius:999px;padding:.15rem .5rem;margin-top:.5rem}
.warn{background:#fff0f1;border:1px solid #f3c3c9;color:#8a1524;border-radius:10px;padding:.5rem .6rem;font-size:.78rem;margin-top:.6rem;text-align:left}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* ---- v1.4 professional storefront skin -------------------------------------
 * Same one tested checkout underneath; this layer is presentation only:
 * a wider responsive shelf, a proper product-media treatment, a sticky
 * browse toolbar, a floating cart bar and template-specific rhythms. */
:root{--radius:20px;--card-shadow:0 1px 2px rgba(16,24,32,.05),0 14px 34px -24px rgba(16,24,32,.28)}
body{background:linear-gradient(180deg,#eef2f5 0,#f7f9fa 22rem,#f4f6f8 100%)}
.wrap{max-width:76rem;padding:0 clamp(.75rem,3vw,1.5rem) 7.5rem}
header{margin:0 calc(clamp(.75rem,3vw,1.5rem) * -1);padding:1rem clamp(1rem,3vw,1.5rem)}
header .brand{max-width:73rem;margin:0 auto}
.logo,.avatarFallback{width:52px;height:52px;border-radius:16px;flex:0 0 auto}
.logo{border:2px solid rgba(255,255,255,.28);box-shadow:0 4px 16px rgba(0,0,0,.22)}
.avatarFallback{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);font-size:1.35rem;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.22)}
h1{font-size:clamp(1.12rem,3vw,1.45rem);letter-spacing:-.015em}
.hero{margin:0 calc(clamp(.75rem,3vw,1.5rem) * -1);min-height:15rem;border-radius:0 0 30px 30px;overflow:hidden}
.hero-in{width:100%;max-width:73rem;margin:0 auto;padding:2rem clamp(1rem,3vw,1.5rem)}
.hero-title{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.035em}
.hero-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.hero-cta,.hero-wa{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.05rem;font-weight:800;font-size:.9rem;text-decoration:none}
.hero-cta{background:#fff;color:#101418;box-shadow:0 10px 26px -14px rgba(0,0,0,.55)}
.hero-wa{background:#128c4a;color:#fff}
.service-strip{display:flex;gap:.5rem;flex-wrap:wrap;margin:.85rem 0 0}
.service-strip span{display:inline-flex;align-items:center;gap:.35rem;background:#fff;border:1px solid #e3eaf0;border-radius:999px;padding:.42rem .65rem;font-size:.76rem;font-weight:700;color:#42566a;box-shadow:0 1px 8px rgba(16,24,32,.035)}
.service-strip b{color:var(--accent-dark)}
.toolbar{position:sticky;top:5.4rem;z-index:4;margin:.9rem 0 .2rem;padding:.8rem .85rem .65rem;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid #e3eaf0;border-radius:20px;box-shadow:0 12px 30px -24px rgba(16,24,32,.35)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.section-head h2{font-size:clamp(1.25rem,3vw,1.7rem);letter-spacing:-.025em;margin:0}
.section-head p{margin:.15rem 0 0;color:#65788b;font-size:.84rem}
.itemCount{white-space:nowrap;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:.32rem .6rem;font-size:.76rem;font-weight:800}
.tools{padding:.65rem 0 0}
.tools input{padding:.72rem 1rem;border-color:#dbe5ed;background:#f8fafc}
.cats{padding:.65rem 0 .1rem}
.cat{padding:.48rem .85rem;font-weight:700;cursor:pointer}
.cat.on{box-shadow:0 8px 18px -12px rgba(16,24,32,.55)}
.grid{gap:.85rem;padding:.85rem 0}
.card{border-radius:var(--radius);box-shadow:var(--card-shadow);transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(16,24,32,.05),0 22px 42px -26px rgba(16,24,32,.38)}}
.media{position:relative;aspect-ratio:4/3;background:#eef2f6;overflow:hidden}
.card .media img,.card .media .noimg{width:100%;height:100%}
.card .noimg{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.95),transparent 34%),linear-gradient(135deg,var(--accent-soft),#eef2f6)}
.noimg span{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;color:var(--accent-dark);opacity:.24}
.pop{position:absolute;top:.6rem;left:.6rem;background:rgba(255,255,255,.96);box-shadow:0 6px 18px -10px rgba(16,24,32,.5)}
.soldflag{position:absolute;top:.6rem;right:.6rem;background:#8a1524;color:#fff;border-radius:999px;padding:.18rem .5rem;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.cb{padding:.78rem .82rem .85rem;gap:.28rem}
.cn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:none}
.price{font-size:1.02rem;letter-spacing:-.01em}
.add{padding:.58rem .9rem;min-height:2.45rem;box-shadow:0 10px 20px -14px rgba(16,24,32,.65);cursor:pointer}
.add:active{transform:scale(.97)}
.sheetImg{width:100%;max-height:15rem;object-fit:cover;border-radius:16px;margin:.2rem 0 .7rem;background:#eef2f6}
.bar{left:50%;right:auto;transform:translateX(-50%);width:min(46rem,calc(100% - 1.5rem));bottom:.85rem;border:1px solid #e1eaf1;border-radius:20px;box-shadow:0 22px 48px -24px rgba(16,24,32,.5);padding:.75rem .85rem calc(.75rem + env(safe-area-inset-bottom))}
.waFloat{bottom:6.4rem}
.skel{border-radius:var(--radius);min-height:15rem;background:linear-gradient(100deg,#e9eef3 40%,#f7fafc 50%,#e9eef3 60%);background-size:200% 100%;animation:sks 1.25s infinite}
@keyframes sks{to{background-position:-200% 0}}
.foot{display:flex;flex-direction:column;align-items:center;gap:.45rem}
.foot .footmark{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;color:#42566a}
@media (min-width:640px){body.layout-grid .grid{grid-template-columns:repeat(3,1fr)}body.layout-compact .grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1024px){body.layout-grid .grid{grid-template-columns:repeat(4,1fr)}body.layout-compact .grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:700px){.sheet{left:50%;right:auto;width:min(44rem,calc(100% - 2rem));bottom:1rem;border-radius:22px;transform:translate(-50%,110%)}.sheet.on{transform:translate(-50%,0)}}
body.layout-list .grid{max-width:56rem;margin:0 auto;width:100%}
body.layout-list .media{width:8.5rem;flex:0 0 8.5rem;aspect-ratio:auto}
body.layout-list .card img,body.layout-list .card .noimg{width:100%;height:100%;min-height:0;flex:none}
body.tpl-fashion .media{aspect-ratio:3/4}
body.tpl-fashion .hero-title{font-family:Georgia,'Times New Roman',serif;font-weight:700}
body.tpl-food .hero{min-height:16rem}
body.tpl-electronics .price{font-family:ui-monospace,Menlo,monospace}
body.tpl-services.layout-list .card{border-left:5px solid var(--accent)}
body.tpl-grocery.layout-compact .media{aspect-ratio:16/10}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.skel{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero" id="hero" hidden>
    <div class="hero-in">
      <div class="kicker" id="heroKicker"></div>
      <div class="hero-title" id="heroTitle"></div>
      <p id="heroText"></p>
      <div class="hero-actions"><a class="hero-cta" href="#browse">Browse items</a><a class="hero-wa" id="heroWa" href="#" hidden>WhatsApp us</a></div>
    </div>
  </div>
  <header>
    <div class="brand">
      <img class="logo" id="logo" alt="" hidden><div class="avatarFallback" id="avatarFallback" aria-hidden="true">S</div>
      <div style="min-width:0">
        <h1 id="sname">Store</h1>
        <p class="tag" id="stag"></p>
        <div class="meta">
          <span class="chip" id="curnow"></span>
          <span class="chip" id="chours" hidden></span>
          <span class="chip" id="cloc" hidden></span>
          <!-- relative on purpose: this page is /s/<handle>, so this is /s/<handle>/share.txt,
               and a link the merchant can forward from the shop itself needs no script -->
          <a class="chip" href="share.txt">Share this shop</a>
          <a class="chip" id="waChip" href="#" hidden>WhatsApp us</a>
        </div>
      </div>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <!-- The buyer's own door, kept on their device for as long as one is valid. It
       offers a link; it never claims the order is still owed anything. -->
  <div class="pfbar" id="pfbar" hidden></div>
  <div class="service-strip" aria-label="How ordering works"><span><b>✓</b> Order on WhatsApp</span><span><b>✓</b> Exact amount to pay</span><span id="serviceMode"><b>✓</b> Pickup or delivery</span></div>
  <div class="welcome" id="welcome" hidden></div>
  <section class="toolbar" id="browse">
    <div class="section-head"><div><h2 id="browseTitle">Browse products</h2><p id="browseSub">Tap an item to add it to your order.</p></div><span class="itemCount" id="itemCount">Loading…</span></div>
    <div class="tools" id="tools" hidden><input id="q" type="search" autocomplete="off" aria-label="Search this shop" placeholder="Search this shop…"></div>
    <div class="cats" id="cats" hidden></div>
  </section>
  <div class="grid" id="grid" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="empty" id="empty" hidden></div>
  <section class="about" id="about" hidden><h2 id="aboutTitle">About this shop</h2><p id="aboutText"></p></section>

  <div class="foot">
    <span class="footmark"><svg width="22" height="22" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#0B5B34"/><path d="M24 52 L40 28 H88 L104 52 Z" fill="#FFB01E"/><circle cx="29" cy="52" r="7.5" fill="#FFB01E"/><circle cx="46.5" cy="52" r="7.5" fill="#FFFFFF"/><circle cx="64" cy="52" r="7.5" fill="#FFB01E"/><circle cx="81.5" cy="52" r="7.5" fill="#FFFFFF"/><circle cx="99" cy="52" r="7.5" fill="#FFB01E"/><rect x="28" y="54" width="7" height="38" rx="3" fill="#E8F7EF"/><rect x="93" y="54" width="7" height="38" rx="3" fill="#E8F7EF"/><rect x="20" y="92" width="88" height="10" rx="5" fill="#FFFFFF"/><circle cx="64" cy="73" r="12" fill="none" stroke="#FFFFFF" stroke-width="6"/><circle cx="64" cy="73" r="4.5" fill="#FFB01E"/></svg><span>Tapstall</span></span>
    <span id="powered"></span>
  </div>
</div>

<a class="waFloat" id="waFloat" href="#" hidden>WhatsApp</a>
<div class="bar" id="bar">
  <div style="flex:1.2">
    <div class="t" id="barTotal">0.00</div>
    <div class="n" id="barN">0 items</div>
  </div>
  <button class="cta" id="toCheckout" style="margin:0;flex:1">Checkout</button>
</div>

<div class="sheet" id="sheet">
  <div class="sh-head"><b id="shTitle">Item</b><button class="x" id="shClose">Close</button></div>
  <div class="body" id="shBody"></div>
</div>

<script>
var CFG = /*__TAPSTALL_CONFIG__*/null;
var TERM = /*__TAPSTALL_TERM__*/null;
(function () {
  if (!CFG) { document.getElementById('notice').hidden = false; document.getElementById('notice').textContent = 'Store config missing. Open /onboard to create a store — it takes about 90 seconds.'; return; }
  var CUR = CFG.currency || 'USD';
  var ZIG = Number(CFG.zig_rate) || 0;
  var $ = function (id) { return document.getElementById(id); };
  /* The outfit arrives resolved: template defaults underneath, this shop's own
     choices over them. The fallback object is for a page/config pair cached from
     before templates existed — it must still look like the old general shop. */
  var D = CFG.design || {};
  D = {
    template: D.template || CFG.business_type || 'general', label: D.label || 'Shop',
    accent: D.accent || '#0a6b33', accent_dark: D.accent_dark || '#0b0f14', accent_soft: D.accent_soft || '#e8f7ef', on_accent: D.on_accent || '#fff',
    layout: D.layout || CFG.store_layout || 'grid', hero: D.hero || CFG.hero_style || 'classic',
    sort: D.sort || CFG.sort_mode || 'popular', cta: D.cta || CFG.cta_label || 'Add',
    popular_label: D.popular_label || 'Popular', empty_title: D.empty_title || 'No products loaded yet',
    cover_image: D.cover_image || CFG.cover_image || '', welcome_message: D.welcome_message || CFG.welcome_message || '',
    about: D.about || CFG.about || '', search: D.search !== false && CFG.search_bar !== 'hide',
    category_bar: D.category_bar !== false && CFG.category_bar !== 'hide',
    descriptions: D.descriptions !== false && CFG.product_descriptions !== 'hide',
    whatsapp_button: !!D.whatsapp_button || CFG.whatsapp_button === 'show'
  };
  document.body.className += ' tpl-' + D.template + ' layout-' + D.layout + ' hero-' + D.hero;
  document.documentElement.style.setProperty('--accent', D.accent);
  document.documentElement.style.setProperty('--accent-dark', D.accent_dark);
  document.documentElement.style.setProperty('--accent-soft', D.accent_soft);
  document.documentElement.style.setProperty('--on-accent', D.on_accent);
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', D.hero === 'minimal' ? '#ffffff' : D.accent_dark);
  var cart = [];
  try {
    var CK = 'tp_cart_' + CFG.handle;
    cart = JSON.parse(localStorage.getItem(CK) || '[]') || [];
  } catch (e) { cart = []; }

  /* A door is only worth handing out if the person it was handed to can find it
     again: people pay, then they close the page. So the receipt's link is kept on
     this device for exactly as long as the platform says one is valid — 72 hours,
     the same number as PROOF_WINDOW_SEC in core.js, pinned in a test — and the code
     page removes the entry when the code is in. Nothing here reads the order back or
     claims anything about it: the line offers, it does not accuse. A spent link still
     tells the truth on the far side ("This link is finished", and the shop can file
     what they send in chat), so nothing has to be certain for this to be safe. */
  var PFK = 'tp_pf_' + CFG.handle, PF_TTL = 72 * 3600 * 1000, PF_MAX = 5;
  function pfLoad() {
    var a = [];
    try { a = JSON.parse(localStorage.getItem(PFK) || '[]'); } catch (e) { a = []; }
    if (!Array.isArray(a)) a = [];
    var cut = Date.now() - PF_TTL;
    a = a.filter(function (x) {
      return x && (Number(x.t) || 0) > cut && typeof x.u === 'string' && /^\/p\/[A-Za-z0-9._-]{20,400}$/.test(x.u);
    });
    return a.slice(-PF_MAX);
  }
  function pfSave(a) { try { localStorage.setItem(PFK, JSON.stringify(a)); } catch (e) {} }
  function pfAdd(code, url) {
    if (!url) return;
    var a = pfLoad().filter(function (x) { return x.c !== String(code || ''); });
    a.push({ c: String(code || '').slice(0, 16), u: url, t: Date.now() });
    pfSave(a.slice(-PF_MAX)); pfRender();
  }
  /* A door is `/p/<cap>` on the receipt and `<origin>/p/<cap>` on a ledger read, and this box
     is fed by both across a reload. Cutting the first three characters is right exactly as long
     as nobody changes the surface; finding the marker is right either way. */
  function pfTok(u) { var i = String(u || '').indexOf('/p/'); return i < 0 ? '' : u.slice(i + 3); }
  function pfDone(code) {
    var a = pfLoad(), n = a.filter(function (x) { return x.c !== String(code || ''); });
    if (n.length !== a.length) pfSave(n);
  }
  function pfRender() {
    var bar = $('pfbar'); if (!bar) return;
    var a = pfLoad();
    if (!a.length) { bar.hidden = true; bar.innerHTML = ''; return; }
    var x = a[a.length - 1];
    bar.hidden = false;
    bar.innerHTML = (a.length > 1 ? '<span>' + a.length + ' orders</span>' : '')
      + 'Order <b>' + esc(x.c) + '</b> — <a href="' + esc(x.u) + '">add your payment code</a>'
      + '<button class="x" id="pfx" aria-label="Dismiss">\u2715</button>';
    $('pfx').onclick = function () { pfDone(x.c); pfRender(); };
  }

  document.title = CFG.shop_name + ' — order on WhatsApp';
  $('sname').textContent = CFG.shop_name;
  if (CFG.tagline) $('stag').textContent = CFG.tagline;
  var av = $('avatarFallback');
  if (av) av.textContent = String(CFG.shop_name || 'S').trim().charAt(0).toUpperCase() || 'S';
  if (CFG.logo) {
    var L = $('logo'); L.src = CFG.logo; L.hidden = false; if (av) av.hidden = true;
    var fav = document.querySelector('link[rel="icon"]'); if (fav) fav.href = CFG.logo;
  }
  var browseTitles = { food: 'Browse the menu', fashion: 'Shop the collection', grocery: 'Everyday essentials', electronics: 'Shop devices & accessories', home: 'Shop home & handmade', services: 'Book a service', general: 'Browse products' };
  if ($('browseTitle')) $('browseTitle').textContent = browseTitles[D.template] || browseTitles.general;
  if ($('browseSub')) $('browseSub').textContent = D.template === 'services' ? 'Choose a service, send the order, and the shop confirms on WhatsApp.' : 'Tap an item to add it to your order.';
  if ($('serviceMode')) $('serviceMode').innerHTML = '<b>✓</b> ' + ((Number(CFG.delivery_fee) || Number(CFG.free_over)) ? 'Pickup or delivery' : 'Pickup available');
  // The shop's own clock, not the buyer's: `open` is computed on the server from
  // the store's week, so a phone in another zone still reads the truth.
  if (CFG.hours || (CFG.open && CFG.open.known)) {
    var ch = $('chours'), o = CFG.open || {};
    ch.textContent = (o.known && !o.open) ? '\u25cf ' + (o.label || 'Closed')
      : (o.label ? '\u25cf ' + o.label + ' \u00b7 ' : '') + (CFG.hours || '');
    ch.style.color = (o.known && !o.open) ? '#a2141f' : '#0a6b33';
    ch.hidden = false;
  }
  if (CFG.location) { $('cloc').textContent = CFG.location; $('cloc').hidden = false; }
  $('curnow').textContent = 'Prices in ' + CUR + (ZIG ? ' + ZiG' : '');
  $('powered').innerHTML = 'Runs on <a href="/onboard">Tapstall</a> — free store for your WhatsApp business, no monthly bill.';
  if (D.hero === 'cover') {
    var hero = $('hero');
    hero.hidden = false;
    $('heroKicker').textContent = D.label;
    $('heroTitle').textContent = CFG.shop_name;
    $('heroText').textContent = D.welcome_message || CFG.tagline || 'Order ahead on WhatsApp — no app, no login.';
    if (D.cover_image) hero.style.backgroundImage = 'linear-gradient(90deg,rgba(5,10,16,.72),rgba(5,10,16,.22)),url("' + String(D.cover_image).replace(/["\\]/g, '') + '")';
  } else if (D.welcome_message) {
    $('welcome').textContent = D.welcome_message;
    $('welcome').hidden = false;
  }
  if (D.about) {
    $('aboutTitle').textContent = 'About ' + CFG.shop_name;
    $('aboutText').textContent = D.about;
    $('about').hidden = false;
  }
  if (D.whatsapp_button && CFG.whatsapp) {
    var wa = 'https://wa.me/' + String(CFG.whatsapp).replace(/\D/g, '') + '?text=' + encodeURIComponent('Hi ' + CFG.shop_name + ', I have a question about your shop.');
    $('waChip').href = wa; $('waChip').hidden = false;
    if ($('heroWa')) { $('heroWa').href = wa; $('heroWa').hidden = false; }
    $('waFloat').href = wa; $('waFloat').hidden = false;
  }
  if (CFG.closed) note('Shop closed right now — you can still order and we will confirm when we open.');
  if (TERM && TERM.state === 'expired') note('This store is paused until the owner renews. Existing orders still reach us on WhatsApp.');
  if (CFG.rail === 'cash' && !CFG.pay_account) note('Cash / pickup payments: pay the runner or pay when you collect.');
  pfRender();

  function note(t) { var n = $('notice'); n.hidden = false; n.textContent = t; }
  function money(n) { return (Number(n) || 0).toFixed(2) + ' ' + CUR; }
  function alt(n) { return ZIG ? '≈ ' + Math.round((Number(n) || 0) * ZIG).toLocaleString() + ' ZiG' : ''; }

  var PRODUCTS = [];
  fetch('/s/' + CFG.handle + '/feed.json', { headers: { accept: 'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (j) { PRODUCTS = (j && j.products) || []; render(); })
    .catch(function () { render(); });

  var activeCat = 'all';
  var query = '';
  function render() {
    var g = $('grid');
    if (!PRODUCTS.length) {
      $('empty').hidden = false;
      $('empty').innerHTML = '<b>' + esc(D.empty_title) + '.</b><br>' + (CFG.feed_error ? '(' + CFG.feed_error + ')' : '') +
        '<br><span style="font-size:.8rem">Owner: share your Google Sheet as “Anyone with the link”, then re-open this page — it refreshes itself in ~2 minutes.</span>';
      g.hidden = true; if ($('browse')) $('browse').hidden = true; if ($('itemCount')) $('itemCount').textContent = '0 items'; return;
    }
    g.hidden = false;
    if ($('browse')) $('browse').hidden = false;
    if ($('itemCount')) $('itemCount').textContent = PRODUCTS.length + (PRODUCTS.length === 1 ? ' item' : ' items');
    if (D.search) {
      $('tools').hidden = false;
      $('q').oninput = function () { query = this.value.trim().toLowerCase(); renderCards(); };
    }
    var cats = [];
    PRODUCTS.forEach(function (p) { if (p.cat && cats.indexOf(p.cat) < 0) cats.push(p.cat); });
    if (D.category_bar && cats.length > 1) {
      $('cats').hidden = false;
      $('cats').innerHTML = ['<button class="cat on" data-c="all">All</button>'].concat(cats.map(function (c) {
        return '<button class="cat" data-c="' + esc(c) + '">' + esc(c) + '</button>';
      })).join('');
      Array.prototype.forEach.call($('cats').children, function (b) {
        b.onclick = function () {
          activeCat = b.getAttribute('data-c');
          Array.prototype.forEach.call($('cats').children, function (x) { x.classList.toggle('on', x === b); });
          renderCards();
        };
      });
    } else {
      activeCat = 'all';
      $('cats').hidden = true;
    }
    renderCards();
  }
  function renderCards() {
    var list = PRODUCTS.filter(function (p) {
      if (activeCat !== 'all' && p.cat !== activeCat) return false;
      if (!query) return true;
      return ((p.name || '') + ' ' + (p.desc || '') + ' ' + (p.cat || '')).toLowerCase().indexOf(query) >= 0;
    });
    if (D.sort === 'popular') list.sort(function (a, b) { return (b.popular ? 1 : 0) - (a.popular ? 1 : 0) || String(a.cat || '').localeCompare(String(b.cat || '')); });
    else if (D.sort === 'price_low') list.sort(function (a, b) { return (Number(a.price) || 0) - (Number(b.price) || 0); });
    else if (D.sort === 'price_high') list.sort(function (a, b) { return (Number(b.price) || 0) - (Number(a.price) || 0); });
    else if (D.sort === 'name') list.sort(function (a, b) { return String(a.name || '').localeCompare(String(b.name || '')); });
    if ($('itemCount')) $('itemCount').textContent = query || activeCat !== 'all' ? (list.length + ' shown') : (PRODUCTS.length + (PRODUCTS.length === 1 ? ' item' : ' items'));
    $('empty').hidden = list.length > 0;
    if (!list.length) $('empty').innerHTML = '<b>Nothing matches that here.</b><br><span style="font-size:.82rem">Try another word, or clear the search to see the whole shop.</span>';
    $('grid').innerHTML = list.map(function (p, i) {
      var idx = PRODUCTS.indexOf(p);
      var img = p.img ? '<img loading="lazy" decoding="async" src="' + esc(p.img) + '" alt="' + esc(p.name) + '">' : '<div class="noimg"><span>' + esc(String(p.name || '?').trim().charAt(0).toUpperCase()) + '</span></div>';
      var soldOut = p.available === false;
      var media = '<div class="media">' + img + (p.popular ? '<span class="pop">★ ' + esc(D.popular_label) + '</span>' : '') + (soldOut ? '<span class="soldflag">Sold out</span>' : '') + '</div>';
      var inCart = cart.filter(function (c) { return c.id === p.id; }).length;
      var cta = soldOut ? '—' : ((p.opts.length || p.addons.length) ? 'Choose' : (inCart ? D.cta + ' +' : D.cta));
      return '<article class="card">' + media + '<div class="cb">' +
        (p.cat ? '<div class="ck">' + esc(p.cat) + '</div>' : '') +
        '<div class="cn">' + esc(p.name) + '</div>' +
        (D.descriptions && p.desc ? '<div class="cd">' + esc(p.desc) + '</div>' : '') +
        '<div class="row"><div><div class="price">' + money(p.price) + '</div>' +
        (ZIG ? '<div class="alt">' + alt(p.price) + '</div>' : '') +
        (soldOut ? '<div class="soldout">sold out</div>' : '') +
        '</div>' +
        '<button class="add" data-i="' + idx + '"' + (soldOut ? ' disabled' : '') + '>' + esc(cta) + '</button>' +
        '</div></div></article>';
    }).join('');
    Array.prototype.forEach.call($('grid').querySelectorAll('.add'), function (b) {
      b.onclick = function () { openItem(PRODUCTS[Number(b.getAttribute('data-i'))]); };
    });
    updateBar();
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  /* ---- item sheet */
  var draft = null;
  function openItem(p) {
    draft = { p: p, opts: {}, addons: {}, qty: 1 };
    p.opts.forEach(function (o) { var c = norm(o.choices[0]); draft.opts[o.name] = { label: c.label, up: c.up }; });
    $('shTitle').textContent = p.name;
    var h = '';
    if (p.img) h += '<img class="sheetImg" src="' + esc(p.img) + '" alt="' + esc(p.name) + '">';
    if (p.desc) h += '<p style="font-size:.85rem;color:#54677a;margin:.2rem 0 .5rem">' + esc(p.desc) + '</p>';
    p.opts.forEach(function (o, oi) {
      h += '<h4>' + esc(o.name) + '</h4><div class="opts" data-oi="' + oi + '">' + o.choices.map(function (c, ci) {
        var cc = norm(c);
        return '<button class="opt' + (ci === 0 ? ' on' : '') + '" data-i="' + ci + '">' + esc(cc.label) + (cc.up ? ' +' + money(cc.up) : '') + '</button>';
      }).join('') + '</div>';
    });
    if (p.addons.length) {
      h += '<h4>Add on</h4><div class="opts">' + p.addons.map(function (a, ai) {
        return '<button class="opt" data-ai="' + ai + '">' + esc(a.name) + ' +' + money(a.price) + '</button>';
      }).join('') + '</div>';
    }
    h += '<div class="qty"><button class="qb" id="qm">−</button><b id="q">1</b><button class="qb" id="qp">+</button>' +
      '<div style="margin-left:auto;text-align:right"><div class="price" id="lu"></div><div class="alt" id="la"></div></div></div>' +
      '<button class="cta" id="addBtn">' + (D.cta === 'Add' ? 'Add to order' : esc(D.cta) + ' this') + '</button>';
    $('shBody').innerHTML = h;
    Array.prototype.forEach.call($('shBody').querySelectorAll('.opts[data-oi] .opt'), function (b) {
      b.onclick = function () {
        var oi = b.parentNode.getAttribute('data-oi');
        draft.opts[p.opts[oi].name] = norm(p.opts[oi].choices[Number(b.getAttribute('data-i'))]);
        Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
        linePrice();
      };
    });
    Array.prototype.forEach.call($('shBody').querySelectorAll('.opt[data-ai]'), function (b) {
      b.onclick = function () {
        var ai = Number(b.getAttribute('data-ai')), a = p.addons[ai];
        if (draft.addons[a.name]) { delete draft.addons[a.name]; b.classList.remove('on'); }
        else { draft.addons[a.name] = a.price; b.classList.add('on'); }
        linePrice();
      };
    });
    $('qm').onclick = function () { draft.qty = Math.max(1, draft.qty - 1); $('q').textContent = draft.qty; linePrice(); };
    $('qp').onclick = function () { draft.qty = Math.min(99, draft.qty + 1); $('q').textContent = draft.qty; linePrice(); };
    linePrice();
    $('addBtn').onclick = function () {
      var ups = Object.keys(draft.opts).map(function (k) { return { name: draft.opts[k], up: 0 }; });
      cart.push({ id: p.id, name: p.name, price: p.price, qty: draft.qty, options: ups, addons: Object.keys(draft.addons).map(function (k) { return draft.addons[k]; }) });
      try { localStorage.setItem('tp_cart_' + CFG.handle, JSON.stringify(cart)); } catch (e) {}
      closeSheet(); renderCards();
    };
    $('sheet').classList.add('on');
  }
  function norm(c) { return (c && typeof c === 'object') ? { label: c.label, up: Number(c.up) || 0 } : { label: String(c), up: 0 }; }
  function linePrice() {
    var ups = Object.keys(draft.opts).reduce(function (a, k) { return a + (draft.opts[k].up || 0); }, 0);
    var unit = draft.p.price + ups + Object.keys(draft.addons).reduce(function (a, k) { return a + draft.addons[k]; }, 0);
    $('lu').textContent = money(unit * draft.qty);
    $('la').textContent = alt(unit * draft.qty);
  }
  function closeSheet() { $('sheet').classList.remove('on'); }
  $('shClose').onclick = closeSheet;

  /* ---- cart bar */
  function cartTotal() {
    return cart.reduce(function (a, c) {
      var u = c.price + (c.addons || []).reduce(function (x, y) { return x + (Number(y) || 0); }, 0) + (c.options || []).reduce(function (x, y) { return x + (Number(y.up) || 0); }, 0);
      return a + u * c.qty;
    }, 0);
  }
  function updateBar() {
    var on = cart.length > 0;
    $('bar').classList.toggle('on', on);
    if (on) {
      $('barTotal').textContent = money(Math.round(cartTotal() * 100) / 100);
      var n = cart.reduce(function (a, c) { return a + c.qty; }, 0);
      $('barN').textContent = n + (n === 1 ? ' item' : ' items');
    }
  }
  $('toCheckout').onclick = openCheckout;

  /* ---- checkout */
  function openCheckout() {
    $('shTitle').textContent = 'Your order';
    var lines = cart.map(function (c, i) {
      var u = c.price + (c.addons || []).reduce(function (x, y) { return x + (Number(y) || 0); }, 0) + (c.options || []).reduce(function (x, y) { return x + (Number(y.up) || 0); }, 0);
      return '<div class="lines"><div><span>' + esc(c.name) + (c.options && c.options.length ? ' · ' + esc(c.options.map(function (o) { return o.name; }).join(', ')) : '') +
        '</span><span>×' + c.qty + ' · ' + money(u * c.qty) + '</span></div></div>' +
        '<button class="x" data-rm="' + i + '" style="margin:-.3rem 0 .4rem">remove</button>';
    }).join('');
    var st = Math.round(cartTotal() * 100) / 100;
    var del = CFG.delivery_fee || 0;
    var freeOver = Number(CFG.free_over) || 0;
    var dCharge = freeOver && st >= freeOver ? 0 : del;
    var taxP = Number(CFG.vat_rate_pct != null && CFG.vat_rate_pct !== '' ? CFG.vat_rate_pct : CFG.tax_pct) || 0;
    var incl = String(CFG.vat_mode || 'excl') === 'incl';
    /* A row's own VAT cell wins, read from the catalogue rather than the cart, so a cart left in
       localStorage from last week cannot price itself and a row that went zero-rated today shows
       zero today. This is the same arithmetic `priceOrder` runs on the worker, per line — the
       preview that rounds differently from the receipt is a promise the shop breaks at the till. */
    var rateOf = function (id) {
      var p = null;
      for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) { p = PRODUCTS[i]; break; }
      var v = p && (p.vat_rate != null ? p.vat_rate : p.vat);
      if (v == null || v === '') return taxP;
      var t = String(v).trim().toLowerCase().replace(/%$/, '');
      if (t === 'zero' || t === 'nil' || t === '0') return 0;
      if (t === 'exempt' || t === 'out' || t === 'none' || t === '-') return -1;
      var n = Number(t);
      return isFinite(n) && n >= 0 && n <= 40 ? Math.round(n * 100) / 100 : taxP;
    };
    var vTot = 0, vBase = 0, vFlat = taxP > 0;
    cart.forEach(function (c) {
      var u = c.price + (c.addons || []).reduce(function (x, y) { return x + (Number(y) || 0); }, 0)
        + (c.options || []).reduce(function (x, y) { return x + (Number(y && y.up) || 0); }, 0);
      var tot = Math.round(u * c.qty * 100) / 100, r = rateOf(c.id);
      if (r !== taxP) vFlat = false;
      if (r <= 0) return;
      vBase += tot;
      vTot += incl ? Math.round((tot - tot / (1 + r / 100)) * 100) / 100 : Math.round(tot * r / 100 * 100) / 100;
    });
    if (dCharge && taxP > 0) { vBase += dCharge; vTot += incl ? Math.round((dCharge - dCharge / (1 + taxP / 100)) * 100) / 100 : Math.round(dCharge * taxP / 100 * 100) / 100; }
    var tax = taxP > 0 ? Math.round(vTot * 100) / 100 : 0;
    var sub = incl ? Math.round((st + dCharge) * 100) / 100 : Math.round((st + dCharge + tax) * 100) / 100;
    var railFee = 0, railNote = '';
    /* `rail_info` is the payment method this shop actually resolves to: one of
       the built-in tariffs, one the operator added this morning, or one the
       merchant described themselves. The receipt on the far side of "place
       order" is computed from these same numbers, so previewing anything else
       is a promise the order would break. Pages served from a cache older than
       the field keep the old estimate. */
    var R = CFG.rail_info || null;
    var cod = !!R && R.type === 'cod';
    var railName = R ? R.label : (CFG.rail || 'cash').replace(/_/g, ' ');
    if (cod) railName = 'Cash on delivery';
    var railCosts = R ? ((Number(R.pct) || 0) + (Number(R.imtt) || 0) + (Number(R.fixed) || 0)) > 0
                      : !!CFG.rail && CFG.rail !== 'cash';
    if (CFG.surcharge_mode === 'pass' && railCosts && !cod) {
      railFee = R ? (Math.round((sub * ((Number(R.pct) || 0) + (Number(R.imtt) || 0)) + (Number(R.fixed) || 0)) * 100) / 100)
                  : Math.round(sub * 3.4) / 100;
      railNote = 'payment cost added at checkout';
    }
    var h = lines +
      '<div class="lines" style="border-top:1px solid #e6ebf0;padding-top:.4rem">' +
      '<div><span>Items</span><span>' + money(st) + '</span></div>' +
      (dCharge ? '<div><span>Delivery</span><span>' + money(dCharge) + '</span></div>' : (del ? '<div><span>Delivery</span><span>free over ' + money(freeOver) + '</span></div>' : '')) +
      (taxP ? '<div><span>' + (incl ? 'VAT ' + taxP + '% inside that price' : 'VAT ' + taxP + '%') + '</span><span>' + money(tax) + '</span></div>' : '') +
      (!taxP ? '' : '<div><span class="hint">' + (incl ? 'Prices on the board already include VAT.' : 'VAT is added to the menu price here.') + '</span></div>') +
      (railFee ? '<div><span>' + esc(railName) + ' fee</span><span>' + money(railFee) + '</span></div>' : '') +
      '<div class="tot"><span>Pay now</span><span>' + money(sub + railFee) + '</span></div></div>' +
      (R && R.crypto ? '<p class="hint">' + esc(R.crypto.asset || 'USDT') + ' on the ' + esc(String(R.crypto.chain || 'tron').toUpperCase()) + ' network (' + esc(R.crypto.network || 'TRC-20') + ') only — sent on any other chain it cannot be recovered. Your wallet’s network fee is on top; the exact total is on your receipt.</p>' : '') +
      (ZIG ? '<p class="hint">ZiG estimate at ' + ZIG + ': ' + Math.round((sub + railFee) * ZIG).toLocaleString() + ' ZiG. Pay what the final receipt says.</p>' : '') +
      (CFG.vat_registered && CFG.vat_number
        ? '<p class="hint">VAT No ' + esc(CFG.vat_number) + ' — you get a numbered tax receipt for this order.</p>' : '') +
      '<p class="hint">Payment: <b>' + esc(railName) + '</b>' + (railNote ? ' — ' + railNote : '') + (CFG.surcharge_mode === 'absorb' && railCosts && !cod ? ' — this shop covers the payment cost, you pay the menu price.' : '') + '</p>' +
      '<label>Your name *</label><input id="fName" autocomplete="name" placeholder="e.g. Rudo M.">' +
      '<label>WhatsApp number * (with code, e.g. 26377...)</label><input id="fPhone" inputmode="tel" autocomplete="tel" placeholder="263771234567">' +
      // Which questions are worth asking a buyer is the rail's business, not this
      // page's: the worker knows a hosted card link has no number to match and a
      // ZIPIT has nothing else to match. So the page obeys what it is told, with the
      // old shape test as the fallback for a config cached before this shipped.
      (R && (R.ask_payer !== undefined ? !!R.ask_payer : (R.type !== 'auto' && R.type !== 'cod' && (R.spec === 'phone' || R.spec === 'shapid' || R.spec === 'wallet' || R.spec === 'bank')))
        ? '<label>Number you will pay from <span style="font-weight:400;color:#93a5b6;font-size:.82em">(optional — helps us find your payment)</span></label><input id="fPayer" inputmode="tel" placeholder="0712345678">'
        : '') +
      // The code their own app prints. Optional unless the shop said it cannot do
      // without it — and even then the order is taken, because a lost sale is worse
      // for the shop than a missing line.
      (R && R.proof && R.proof !== 'none'
        ? '<label>' + esc(R.proof_label || 'Code from the app')
          + (R.proof === 'require' ? ' *' : ' <span style="font-weight:400;color:#93a5b6;font-size:.82em">(optional — helps us find your payment)</span>')
          + '</label><input id="fProof" autocomplete="off" placeholder="e.g. 88123456">'
          + '<p class="hint">' + esc(R.proof_hint || 'The confirmation your app or SMS shows after it sends.') + '</p>'
          + (R.proof === 'require' ? '<p class="hint" id="pfNeed">This shop cannot find a payment without it. If you have not paid yet, pay first and come back to this page — the code is on the confirmation.</p>' : '')
        : '') +
      '<label>Delivery or pickup?</label><select id="fService"><option value="pickup">Pickup at shop</option><option value="delivery">Delivery</option></select>' +
      '<div id="addrWrap" hidden><label>Delivery address *</label><input id="fAddr" placeholder="Suburb, street, house/stand no."></div>' +
      '<label>When?</label><select id="fWhen"><option value="asap">As soon as possible</option><option value="12:00">12:00</option><option value="13:00">13:00</option><option value="17:00">17:00</option><option value="18:00">18:00</option><option value="tomorrow">Tomorrow</option></select>' +
      '<label>Note for the shop</label><textarea id="fNote" placeholder="allergies, landmark for delivery, gate code…"></textarea>' +
      (CFG.require_optin ? '<label style="font-weight:400;display:flex;gap:.5rem;align-items:flex-start;margin-top:.7rem"><input type="checkbox" id="fOpt" style="width:auto;margin-top:.25rem"><span>I agree to be contacted on this number about my order.</span></label>' : '') +
      '<button class="cta" id="place">Place order · ' + money(sub + railFee) + '</button>' +
      '<button class="cta ghost" id="shut">Keep shopping</button>';
    $('shBody').innerHTML = h;
    $('sheet').classList.add('on');
    var svc = $('fService');
    svc.onchange = function () { $('addrWrap').hidden = svc.value !== 'delivery'; };
    if (CFG.only_delivery) { svc.value = 'delivery'; svc.onchange(); }
    Array.prototype.forEach.call($('shBody').querySelectorAll('[data-rm]'), function (b) {
      b.onclick = function () { cart.splice(Number(b.getAttribute('data-rm')), 1); try { localStorage.setItem('tp_cart_' + CFG.handle, JSON.stringify(cart)); } catch (e) {} closeSheet(); renderCards(); };
    });
    $('shut').onclick = closeSheet;
    var pf = $('fProof');
    if (pf && R && R.proof === 'require') {
      // One firm ask, then get out of the way: an empty code is a problem the shop
      // can solve by asking, a lost buyer is a problem nobody can solve.
      pf.oninput = function () { var n = $('pfNeed'); if (n) n.style.display = ''; };
    }
    var nudged = false;
    $('place').onclick = function () {
      var pf = $('fProof');
      if (!nudged && pf && R && R.proof === 'require' && !pf.value.trim()) {
        nudged = true; pf.focus();
        var n = $('pfNeed'); if (n) { n.textContent = 'Add the code if your app gave you one — or send it as it is and the shop will ask you for it.'; n.style.color = '#a2141f'; }
        return;
      }
      var btn = $('place'); btn.disabled = true; btn.textContent = 'Sending…';
      fetch('/api/order', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          handle: CFG.handle, items: cart, service: svc.value, when: $('fWhen').value,
          buyer: { name: $('fName').value, phone: $('fPhone').value, payer: $('fPayer') ? $('fPayer').value : '', proof: $('fProof') ? $('fProof').value : '', address: $('fAddr') ? $('fAddr').value : '', note: $('fNote').value, optin: $('fOpt') ? $('fOpt').checked : true }
        })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (!res.ok || !res.j.ok) { btn.textContent = res.j && res.j.error ? res.j.error : 'Could not place order'; return; }
          cart = []; try { localStorage.setItem('tp_cart_' + CFG.handle, '[]'); } catch (e) {}
          showDone(res.j);
        })
        .catch(function () { btn.disabled = false; btn.textContent = 'Network problem — try again'; });
    };
  }

  function showDone(o) {
    var pr = o.pricing || {}, pay = o.pay || {};
    /* The one thing a buyer still has to do is type what their own app printed, and
       they are looking at the confirmation right now. So the receipt holds the door
       open: one field, this order only, no chat needed. An order that already has
       the code says nothing, and a rail that never asked says nothing either. */
    var needDoor = !pay.proof && pay.proof_mode && pay.proof_mode !== 'none' && !!o.proof_url;
    /* v0.7.9: the field itself, here, rather than a link to it. The code the buyer's app
       printed is on the screen in front of them and fades from memory at the rate of one
       distraction per order, so the box is put where the confirmation already is. It is the
       same door the link opens — the cap this response just handed this browser, the same
       one field, the same endpoint — and nothing about what that token may do changed
       because the box moved closer. Without JS the <form> still posts to the door's page
       path, so the box is an enhancement, never a requirement. */
    var pfBox = '<div style="background:#fff;color:#101418;border-radius:12px;padding:.7rem;margin:.6rem 0 0">'
      + '<form id="pff" method="post" action="/api/proof">'
      + '<input type="hidden" name="cap" value="' + esc(pfTok(o.proof_url)) + '">'
      + '<input type="hidden" name="form" value="1">'
      + '<label for="fPfCode">' + esc(pay.proof_label || 'Code from the app') + '</label>'
      + '<input id="fPfCode" name="proof" maxlength="40" autocapitalize="characters" spellcheck="false" autocomplete="off"'
      + ' placeholder="e.g. 88123456" style="border-color:#cfd8e3">'
      + (pay.ask_payer
          ? '<label for="fPfPayer">Number you will pay from <span style="font-weight:400;color:#65788b;font-size:.82em">'
            + '(optional — helps us find your payment)</span></label>'
            + '<input id="fPfPayer" name="payer" maxlength="30" inputmode="tel" autocomplete="off" spellcheck="false"'
            + ' placeholder="0712345678" style="border-color:#cfd8e3">'
          : '')
      + '<button class="cta" id="pfBtn" type="submit" style="margin-top:.6rem">Put it on my order</button>'
      + '<p class="hint" id="pfMsg" style="color:#65788b">' + esc(pay.proof_hint
          || 'The code your app shows after it sends — one field, and it goes straight on the order.') + '</p>'
      + '</form></div>';
    var addProof = (pay.proof || !pay.proof_mode || pay.proof_mode === 'none') ? '' : '<p class="hint">'
      + (o.proof_url
          ? (pay.proof_mode === 'require'
              ? 'Paid? <a href="' + esc(o.proof_url) + '">add your code here</a> — the shop cannot see your payment until it is on the order.'
              : 'If your app gave you a code, <a href="' + esc(o.proof_url) + '">add it here</a> — it goes on the order without you messaging anybody.')
          : 'You did not send the code the app shows. The shop will message you for it — nothing else about your order is delayed.') + '</p>';
    var h = '<div class="done"><div class="tick">✓</div>' +
      '<b>Order ' + esc(o.order.code) + ' received</b>' +
      '<div class="badge">Stored with the shop — no screenshot needed</div>' +
      '<div class="paybox">' +
      '<div style="font-size:.78rem;color:#9fb2c4">Pay exactly</div>' +
      '<div class="big">' + (pay.amount || pr.pay_now) + ' ' + esc(pay.crypto ? (pay.crypto.asset || 'USDT') : CUR) + '</div>' +
      (ZIG && !pay.crypto ? '<div style="font-size:.78rem;color:#9fb2c4">≈ ' + Math.round((pay.amount || 0) * ZIG).toLocaleString() + ' ZiG</div>' : '') +
      '<div class="kv"><span>Method</span><span>' + esc(pay.rail || pr.rail && pr.rail.label || '') + '</span></div>' +
      (pay.dial ? '<div class="kv"><span>Dial</span><span>' + esc(pay.dial) + '</span></div>' : '') +
      (pay.account ? '<div class="kv"><span>' + esc(pay.account_label || 'To') + '</span><span>' + esc(pay.account)
          + (pay.till ? ' <span style="color:#93a5b6">till ' + esc(pay.till) + '</span>' : '') + '</span></div>' : '') +
      (pay.holder ? '<div class="kv"><span>Should read</span><span>' + esc(pay.holder) + '</span></div>' : '') +
      (pay.payer_from ? '<div class="kv"><span>From</span><span>' + esc(pay.payer_from) + '</span></div>' : '') +
      '<div class="kv"><span>Reference</span><span>' + esc(pay.reference || o.order.code) + '</span></div>' +
      (pay.proof ? '<div class="kv"><span>' + esc(pay.proof_label || 'Code from the app') + '</span><span>' + esc(pay.proof) + '</span></div>' : '') +
      (needDoor ? pfBox : addProof) +
      '<div class="copy" id="cp">Copy payment reference + amount</div>' +
      '<ol class="steps">' + (pay.steps || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<p class="hint">' + esc(pay.note || '') + '</p>' +
      '</div>' +
      (o.wa_link ? '<button class="cta" id="waBtn">Send my order on WhatsApp</button>' : '') +
      '<div class="lines" style="margin-top:.8rem">' + (pr.lines || []).map(function (l) {
        return '<div><span>' + l.qty + '× ' + esc(l.name) + '</span><span>' + money(l.total) + '</span></div>';
      }).join('') +
      (pr.delivery ? '<div><span>Delivery</span><span>' + money(pr.delivery) + '</span></div>' : '') +
      (pr.tax ? '<div><span>VAT ' + pr.taxPct + '%</span><span>' + money(pr.tax) + '</span></div>' : '') +
      (pr.fee ? '<div><span>Payment fee</span><span>' + money(pr.fee) + '</span></div>' : '') +
      '<div class="tot"><span>Total</span><span>' + money(pr.total) + '</span></div>' +
      (pr.unique_change ? '<div><span style="color:#65788b">odd cents included to identify your payment</span><span>' + money(pr.unique_change) + '</span></div>' : '') +
      '</div>' +
      (o.risk_flags && o.risk_flags.length ? '<div class="warn">The shop will double-check this order before sending: ' + esc(o.risk_flags.join(', ')) + '</div>' : '') +
      (o.trust && o.trust.orders_before > 1 ? '<div class="badge">Welcome back — ' + o.trust.orders_before + ' orders from this number</div>' : '') +
      '</div>';
    if (needDoor) pfAdd(o.order.code, o.proof_url);
    $('shTitle').textContent = 'Almost done';
    $('shBody').innerHTML = h;
    $('sheet').classList.add('on');
    if (o.wa_link) $('waBtn').onclick = function () { window.location.href = o.wa_link; };
    if (needDoor) $('pff').onsubmit = function (ev) {
      ev.preventDefault();
      var btn = $('pfBtn'), msg = $('pfMsg'), code = ($('fPfCode').value || '').trim();
      var body = { cap: pfTok(o.proof_url), proof: code };
      if (pay.ask_payer) body.payer = ($('fPfPayer').value || '').trim();
      btn.disabled = true; btn.textContent = 'Sending…';
      fetch('/api/proof', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          var j = res.j || {};
          if (res.ok && j.ok) {
            // the link this box posted is spent, so the box takes the one this answer was
            // kind enough to hand back: same field, one more write, no new trip anywhere
            // used up, so the kept entry goes with it: one line under the notice bar and
            // this box are the same door, and it is closed now either way
            if (j.proof_url) o.proof_url = j.proof_url;
            // while the field still has changes on it the door stays on the device, in this
            // same slot: the link this box used is dead, and the only place the fresh one was
            // ever written is this answer. Nothing re-mints it while a code is on file.
            if (j.proof_url && j.left > 0) pfAdd(o.order.code, j.proof_url); else pfDone(o.order.code);
            $('pff').outerHTML = '<div class="kv"><span>' + esc(pay.proof_label || 'Code from the app')
              + '</span><span><b>' + esc(j.proof || code) + '</b>'
              + (j.payer ? ', from ' + esc(j.payer) : '') + '</span></div>'
              // the link this box just used is spent, and the answer carried the next one, so
              // the receipt keeps a way to correct a typo rather than stranding it in a response
              + (j.proof_url && j.left > 0 ? '<p class="hint"><a href="' + esc(j.proof_url)
                  + '">Correct it</a> — this field takes ' + j.left + ' more on this order.</p>' : '');
            return;
          }
          btn.disabled = false; btn.textContent = 'Put it on my order';
          var m = j.error || 'Could not send that — check your connection and try again.';
          msg.textContent = m;
          // only the Worker knows whether a refusal ends the door, so only it says so:
          // `final` is a fact about the order, and a browser that guessed it from the
          // sentence would stop working the day the sentence was reworded
          if (j.final || j.used) { pfDone(o.order.code); $('pff').outerHTML = '<p class="hint">' + esc(m) + '</p>'; }
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = 'Put it on my order';
          msg.textContent = 'Network problem — nothing was sent, and your code is still on this screen.';
        });
    };
    $('cp').onclick = function () {
      var t = 'Order ' + o.order.code + ' — pay ' + (pay.amount || pr.pay_now) + ' ' + CUR + ' to ' + (pay.account || '') + ' (' + (pay.rail || '') + (pay.dial ? ' ' + pay.dial : '') + ') ref ' + (pay.reference || o.order.code);
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { $('cp').textContent = 'Copied ✓'; });
    };
  }
  function money(n) { return (Number(n) || 0).toFixed(2) + ' ' + CUR; }
  updateBar();
})();
</script>
</body>
</html>
