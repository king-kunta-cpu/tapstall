<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0f14">
<title>ZimLink — confirm</title>
<style>
/*__KIT__*/
main { padding-top: 0 }
.sheet-in { padding: 1.1rem }
.amount { font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: .1rem 0 0 }
.who { font-size: .95rem; margin: .1rem 0 0 }
.state { text-align: center; padding: 1.4rem .4rem .2rem }
.state svg { width: 52px; height: 52px }
.post { font-size: .78rem; color: var(--ink-3); margin-top: .55rem }
.acts { display: grid; gap: .45rem; margin-top: .8rem }
@media (min-width: 30rem) { .acts { grid-template-columns: 1fr 1fr } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px }
@keyframes sp { to { transform: rotate(1turn) } }
</style>
</head>
<body>
<div class="chrome"><div class="in"><b id="brand">ZimLink</b><a href="/a">dashboard</a></div></div>
<main><div class="wrap narrow">
<div class="card sheet-in">
  <p class="muted" id="doing" style="margin:0">Confirming an order</p>
  <h1 id="head">Working it out…</h1>
  <p class="amount hide" id="amt"></p>
  <p class="who hide" id="who"></p>
  <div id="body"></div>
  <div class="acts hide" id="acts"></div>
  <p class="post" id="post"></p>
</div>
<p class="muted" style="text-align:center">This page changes nothing on its own — your browser sends the confirmation. Opening, previewing or scanning the link cannot mark anything paid, which is why it is safe to paste anywhere.</p>
</div></main>

<noscript>
  <div class="wrap narrow" style="padding:0 1rem">
    <div class="card">
      <h3>JavaScript is off</h3>
      <p class="muted">Press the button to confirm this order. It does exactly what the automatic step would have done.</p>
      <form method="post" action="/api/mark">
        <input type="hidden" name="cap" id="nscap" value="">
        <button class="ok" type="submit" style="width:100%">Confirm by button</button>
      </form>
    </div>
  </div>
</noscript>

<script>
var S = /*__ZIMLINK_CONFIRM__*/null || { state: 'expired' };
var q = function (s) { return document.querySelector(s); };
function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
var ICON = {
  ok: '<svg viewBox="0 0 48 48" fill="none" stroke="#0b5b34" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="21" stroke-opacity=".25"/><path d="M15 24l6 6 12-13"/></svg>',
  wait: '<svg viewBox="0 0 48 48" fill="none" stroke="#8a5b00" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="21" stroke-opacity=".25"/><path d="M24 14v11l7 4"/></svg>',
  bad: '<svg viewBox="0 0 48 48" fill="none" stroke="#b00020" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="21" stroke-opacity=".25"/><path d="M18 18l12 12M30 18L18 30"/></svg>'
};
function done(icon, head, body, badge) {
  q('#doing').innerHTML = badge || 'Result';
  q('#head').textContent = head;
  q('#body').innerHTML = '<div class="state">' + ICON[icon] + '</div><p class="muted">' + body + '</p>';
}
function post(mark) {
  q('#post').innerHTML = '<span class="spin"></span> sending to your store…';
  fetch('/api/mark', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ cap: S.cap })
  }).then(function (r) { return r.text().then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) {} return { s: r.status, j: j }; }); })
    .then(function (res) {
      var j = res.j || {};
      if (!j.ok) { q('#post').innerHTML = '<span style="color:var(--bad)">' + esc(j.error || 'could not reach the server') + '</span>' + (mark ? ' — <a href="' + mark + '">open the dashboard instead</a>' : ''); return; }
      q('#amt').classList.add('hide'); q('#who').classList.add('hide');
      done('ok', j.label || (j.status === 'paid' ? 'Marked paid' : 'Done'),
        esc(S.code || '') + ' is now <b>' + esc(j.status || S.want) + '</b>. The buyer keeps the payment details printed on their slip, so nothing you just did can change what they were told to pay.',
        'Confirmed');
      if (j.undo_url) {
        q('#acts').classList.remove('hide');
        q('#acts').innerHTML = '<button class="sec" id="undo">That was a mistake — undo</button>';
        q('#undo').onclick = function () {
          this.disabled = true;
          fetch('/api/mark', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cap: j.undo_url.split('/c/')[1] }) })
            .then(function (r) { return r.json(); }).then(function (u) {
              if (u.ok) done('wait', 'Reopened', 'The order is back to <b>' + esc(u.status) + '</b>, and you have 15 minutes to change your mind again.', 'Undone');
              else { alert(u.error || 'could not undo'); }
              q('#acts').classList.add('hide');
            });
        };
      } else q('#acts').classList.add('hide');
      setTimeout(function () { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }, 60);
    })
    .catch(function () { q('#post').innerHTML = '<span style="color:var(--bad)">No reply from the server — the button below still works.</span>'; });
}

(function boot() {
  var ns = q('#nscap'); if (ns) ns.value = S.cap || '';
  if (S.shop) q('#brand').textContent = S.shop;
  if (S.state === 'expired') {
    done('bad', 'This link has expired', 'Confirm links live for 72 hours and each state can only be confirmed once. Open <a href="/a">your dashboard</a> and tap Confirm on the order — it does exactly the same thing, and it never expires.', 'Nothing to do');
    q('#post').textContent = 'Nothing was changed.';
    return;
  }
  if (S.state === 'missing') {
    done('bad', 'Order not found', 'It may have been archived with the store’s older records. If the buyer paid, they are looking at their own slip with your number on it, so the money is not lost — check your account.', 'Nothing to do');
    return;
  }
  q('#amt').classList.remove('hide');
  q('#amt').textContent = (Number(S.amount) || 0).toFixed(2) + ' ' + (S.currency || 'USD');
  q('#who').classList.remove('hide');
  q('#who').innerHTML = esc(S.buyer || 'buyer') + (S.rail ? ' · via ' + esc(S.rail) : '') + ' · <span class="mono">' + esc(S.code || '') + '</span>';
  if (S.state === 'already') {
    done('ok', 'Already ' + (S.want === 'cancelled' ? 'cancelled' : 'paid'), 'This order was settled on ' + esc(String(S.marked_at || '').slice(0, 16).replace('T', ' ')) + ' UTC. Tapping again changes nothing, so nothing was changed now.', 'No change');
    return;
  }
  q('#doing').textContent = S.want === 'cancelled' ? 'Cancelling an order' : 'Confirming an order';
  q('#head').textContent = S.want === 'cancelled' ? 'Cancel ' + (S.code || 'this order') + '?' : 'Mark ' + (S.code || 'this order') + ' paid?';
  q('#acts').classList.remove('hide');
  q('#acts').innerHTML = '<button class="ok" id="yes">Yes — ' + (S.want === 'cancelled' ? 'cancel it' : 'mark paid') + '</button>'
    + '<button class="sec" id="no">Not now</button>';
  q('#post').innerHTML = 'Your browser can send it now, or you can press the button — same request, one tap either way.';
  q('#yes').onclick = function () { this.disabled = true; post(S.store_url); };
  q('#no').onclick = function () { done('wait', 'Left as it was', 'Nothing was sent. The order stays ' + esc(S.want === 'cancelled' ? 'live' : 'awaiting payment') + ' and this link still works for ' + 'the rest of its 72 hours.', 'Skipped'); q('#acts').innerHTML = '<a class="sm" href="/a" style="text-align:center;text-decoration:none;padding:.6rem;border:1px solid var(--line-2);border-radius:10px;display:block">Open my dashboard</a>'; };
  // one tap total: fire it automatically unless the merchant just arrived with
  // the page open in a preview (visibilitychange covers the scanned-bot case,
  // and the button is there if the auto-send is refused)
  if (!document.hidden) setTimeout(function () { var b = q('#yes'); if (b && !b.disabled) { b.textContent = 'Sent ✓ — undo below if wrong'; b.disabled = true; post(S.store_url); } }, 260);
})();
</script>
</body>
</html>
