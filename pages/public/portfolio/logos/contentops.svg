<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ContentOps">
  <title>ContentOps</title>
  <defs>
    <linearGradient id="coTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".45" stop-color="#7c3aed"/>
      <stop offset=".8" stop-color="#d6336c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Two fills on purpose: the first rect is a solid colour any renderer can paint (naive
       rasterisers - ImageMagick without librsvg, some OS icon caches, older mail clients -
       cannot resolve an SVG gradient and fall back to black, which is how a gradient-only
       favicon turns into a black square). The second rect paints the gradient on top where
       gradients are supported. Same idea for the raster icons: generated PNG/ICO, colour baked in. -->
  <rect width="64" height="64" rx="14" fill="#6d28d9"/>
  <rect width="64" height="64" rx="14" fill="url(#coTile)"/>
  <g transform="translate(5.37 9.35) scale(1.048)">
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M8 36 L23 24 L38 12" stroke-width="4.6"/>
      <circle cx="38" cy="12" r="9" stroke-width="2" opacity=".4"/>
    </g>
    <g fill="#ffffff">
      <circle cx="8" cy="36" r="5.2"/>
      <circle cx="23" cy="24" r="5.2"/>
      <circle cx="38" cy="12" r="6.8"/>
    </g>
  </g>
</svg>
